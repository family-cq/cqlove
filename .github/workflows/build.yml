name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 编译期可选依赖：Jade（仅用于 tooltip 集成的 import）。
      # 不进 jar、不声明运行时依赖，CI 上现取现用，避免把第三方二进制提交进仓库。
      - name: Fetch Jade (compileOnly)
        run: |
          mkdir -p libs
          curl -fL -o libs/jade-neoforge-26.1.12.jar \
            https://cdn.modrinth.com/data/nvQzSEkH/versions/Pr1h4azo/Jade-mc26.1-NeoForge-26.1.12.jar

      # gradle.properties 里写死了本机 JDK 路径（D:/java_25）用于本地构建，
      # CI 上需要用 setup-java 提供的 JAVA_HOME 覆盖掉。
      - name: Build with Gradle
        run: >
          ./gradlew build
          -Porg.gradle.java.installations.paths="${JAVA_HOME}"
          -Porg.gradle.java.installations.auto-download=true

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: cqlove-jar
          path: build/libs/*.jar
          if-no-files-found: warn
